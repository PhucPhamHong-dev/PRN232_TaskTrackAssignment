name: Build and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/StudentID_ClassCode_Ass1_BE.sln
      - run: dotnet build backend/StudentID_ClassCode_Ass1_BE.sln --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/StudentID_ClassCode_Ass1_FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/StudentID_ClassCode_Ass1_FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
